<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labs · LabSpot</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/labs.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/labs">LabSpot</a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="account-box">
        <span id="who" class="who"></span>
        <button id="theme-toggle" class="secondary theme-toggle" type="button"><span class="symbol" aria-hidden="true">☾</span><span class="theme-word">Dark</span></button>
        <button id="sign-out" class="secondary" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <h1>Labs</h1>
    <p class="intro">All labs you can book, and how many of its workstations are in service.</p>
    <div id="labs-status" class="status" role="status"><span class="visually-hidden">Loading labs…</span></div>
    <div id="labs-error" class="message error" role="alert" hidden>
      <span class="symbol" aria-hidden="true">!</span>
      <div class="message-body">
        <p id="labs-error-text"></p>
        <button id="labs-retry" class="secondary" type="button">Try again</button>
      </div>
    </div>
    <div id="labs-region" class="region" aria-busy="true">
      <div class="placeholders card-grid" aria-hidden="true">
        <div class="placeholder placeholder-card"></div>
        <div class="placeholder placeholder-card"></div>
        <div class="placeholder placeholder-card"></div>
      </div>
      <ul id="labs" class="lab-list card-grid" hidden></ul>
    </div>
  </main>
</body>
</html>

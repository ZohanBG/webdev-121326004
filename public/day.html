<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day view · LabSpot</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/day.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/labs">LabSpot</a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="account-box">
        <span id="who" class="who"></span>
        <button id="theme-toggle" class="secondary theme-toggle" type="button"><span class="symbol" aria-hidden="true">☾</span><span class="theme-word">Dark</span></button>
        <button id="sign-out" class="secondary" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <h1>Day view</h1>
    <p class="intro">Every workstation on one weekday in the next two weeks, in two-hour blocks.</p>
    <form id="day-picker" class="day-picker">
      <button id="prev-day" class="secondary" type="button" aria-label="Previous weekday">‹</button>
      <label for="date" class="visually-hidden">Date</label>
      <input id="date" name="date" type="date" required>
      <button id="next-day" class="secondary" type="button" aria-label="Next weekday">›</button>
    </form>
    <p id="day-heading" class="day-heading"></p>

    <form id="suggest" class="card suggest form" hidden>
      <label for="suggest-text">Describe what you need</label>
      <textarea id="suggest-text" name="text" rows="2" maxlength="300" required
        placeholder="e.g. quiet place with two monitors, Thursday afternoon"></textarea>
      <button id="suggest-button" type="submit">Suggest a slot</button>
      <div id="suggest-result" class="suggestion" role="status" hidden></div>
    </form>

    <section class="card feature-filter" aria-labelledby="filter-title">
      <div class="filter-head">
        <h2 id="filter-title">Filter by features</h2>
        <button id="filter-clear" class="secondary" type="button" hidden>Clear filters</button>
      </div>
      <p class="muted">Shows only workstations that have every feature you pick.</p>
      <div id="filter-chips"></div>
      <p id="filter-status" class="muted" role="status"></p>
    </section>

    <div id="day-notice" class="message" role="status" hidden></div>
    <div id="day-status" class="status" role="status"><span class="visually-hidden">Loading the day…</span></div>
    <div id="day-error" class="message error" role="alert" hidden>
      <span class="symbol" aria-hidden="true">!</span>
      <div class="message-body">
        <p id="day-error-text"></p>
        <button id="day-retry" class="secondary" type="button">Try again</button>
      </div>
    </div>
    <div id="day-region" class="region" aria-busy="true">
      <div class="placeholders" aria-hidden="true">
        <div class="placeholder placeholder-title"></div>
        <div class="placeholder placeholder-lab"></div>
      </div>
      <div id="day-content" hidden></div>
    </div>
  </main>
</body>
</html>

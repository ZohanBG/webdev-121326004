<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage labs · LabSpot</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/staff-labs.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/labs">LabSpot</a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="account-box">
        <span id="who" class="who"></span>
        <button id="theme-toggle" class="secondary theme-toggle" type="button"><span class="symbol" aria-hidden="true">☾</span><span class="theme-word">Dark</span></button>
        <button id="sign-out" class="secondary" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <h1>Manage labs</h1>
    <p class="intro">Add labs and workstations, set their features, and take a workstation out of service.</p>
    <div id="staff-notice" class="message" role="status" hidden></div>

    <div class="forms">
      <form id="add-lab" class="card form" aria-labelledby="add-lab-title">
        <h2 id="add-lab-title">Add a lab</h2>
        <label for="lab-name">Name</label>
        <input id="lab-name" name="name" required maxlength="100">
        <label for="lab-room">Room</label>
        <input id="lab-room" name="room" required maxlength="20">
        <button type="submit">Add lab</button>
      </form>

      <form id="add-workstation" class="card form" aria-labelledby="add-ws-title">
        <h2 id="add-ws-title">Add a workstation</h2>
        <label for="ws-lab">Lab</label>
        <select id="ws-lab" name="labId" required></select>
        <label for="ws-label">Label</label>
        <input id="ws-label" name="label" required maxlength="20" placeholder="e.g. NL-05">
        <p class="field-label" id="ws-features-title">Features</p>
        <div id="ws-features" class="features-picker" role="group" aria-labelledby="ws-features-title"></div>
        <button type="submit">Add workstation</button>
      </form>
    </div>

    <h2 class="section-title">Labs and workstations</h2>
    <div id="staff-status" class="status" role="status"><span class="visually-hidden">Loading labs…</span></div>
    <div id="staff-error" class="message error" role="alert" hidden>
      <span class="symbol" aria-hidden="true">!</span>
      <div class="message-body">
        <p id="staff-error-text"></p>
        <button id="staff-retry" class="secondary" type="button">Try again</button>
      </div>
    </div>
    <div id="staff-region" class="region" aria-busy="true">
      <div class="placeholders" aria-hidden="true">
        <div class="placeholder placeholder-card"></div>
        <div class="placeholder placeholder-card"></div>
      </div>
      <div id="staff-labs" class="stack" hidden></div>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · LabSpot</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/my-bookings.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/labs">LabSpot</a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="account-box">
        <span id="who" class="who"></span>
        <button id="theme-toggle" class="secondary theme-toggle" type="button"><span class="symbol" aria-hidden="true">☾</span><span class="theme-word">Dark</span></button>
        <button id="sign-out" class="secondary" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <h1>My bookings</h1>
    <p class="intro">Your upcoming bookings. You can cancel one until its block starts.</p>
    <div id="mine-notice" class="message" role="status" hidden></div>
    <div id="mine-status" class="status" role="status"><span class="visually-hidden">Loading your bookings…</span></div>
    <div id="mine-error" class="message error" role="alert" hidden>
      <span class="symbol" aria-hidden="true">!</span>
      <div class="message-body">
        <p id="mine-error-text"></p>
        <button id="mine-retry" class="secondary" type="button">Try again</button>
      </div>
    </div>
    <div id="mine-region" class="region" aria-busy="true">
      <div class="placeholders" aria-hidden="true">
        <div class="placeholder placeholder-title"></div>
        <div class="placeholder"></div>
        <div class="placeholder"></div>
      </div>
      <div id="mine" class="day-groups" hidden></div>
    </div>
  </main>
</body>
</html>

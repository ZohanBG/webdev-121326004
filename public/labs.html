<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labs · LabSpot</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/labs.js"></script>
</head>
<body>
  <header class="topbar">
    <p class="brand">LabSpot</p>
    <button id="sign-out" class="secondary" type="button">Sign out</button>
  </header>
  <main>
    <h1>Labs</h1>
    <p id="labs-status" class="muted" role="status">Loading labs…</p>
    <div id="labs-error" class="message error" role="alert" hidden>
      <p id="labs-error-text"></p>
      <button id="labs-retry" class="secondary" type="button">Try again</button>
    </div>
    <ul id="labs" class="lab-list" hidden></ul>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All bookings · LabSpot</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/staff-bookings.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/labs">LabSpot</a>
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <button id="sign-out" class="secondary" type="button">Sign out</button>
  </header>
  <main>
    <h1>All bookings</h1>
    <form id="all-picker" class="day-picker">
      <label for="all-date" class="visually-hidden">Date</label>
      <input id="all-date" name="date" type="date" required>
    </form>
    <p id="all-heading" class="muted"></p>
    <div id="all-notice" class="message" role="status" hidden></div>
    <p id="all-status" class="muted" role="status">Loading bookings…</p>
    <div id="all-error" class="message error" role="alert" hidden>
      <p id="all-error-text"></p>
      <button id="all-retry" class="secondary" type="button">Try again</button>
    </div>
    <ul id="all" class="booking-list" hidden></ul>
  </main>
</body>
</html>
